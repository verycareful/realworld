# Builds the jar and publishes a GitHub release when a version tag is pushed.
#
# The tag is v<mod_version>, for example v2.1.2.0. The workflow runs from the
# copy of this file at the tagged commit, so each branch's copy carries the
# JDK and Minecraft line that branch builds for, and no branch logic is needed.
#
# Two guards run before anything is built: the tag must match mod_version in
# gradle.properties, and its first component must be this branch's line.
# Release notes are the tag's section of CHANGELOG.md, verbatim; a missing
# section fails the release rather than publishing one with no notes.

name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # The Minecraft line this branch builds for: first component of mod_version.
  LINE: '2'

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: check tag against gradle.properties
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match mod_version=$version"
            exit 1
          fi
          if [ "${tag%%.*}" != "$LINE" ]; then
            echo "::error::tag v$tag is not on line $LINE; this branch's workflow only releases $LINE.x.y.z"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no ## [$VERSION] section"
            exit 1
          fi
          cat notes.md

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Realworld $VERSION" \
            --notes-file notes.md \
            --latest \
            "build/libs/realworld-$VERSION.jar" \
            "build/libs/realworld-$VERSION-sources.jar"
