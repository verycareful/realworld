plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Loom adds the Minecraft and Fabric repositories itself. Only mods this
	// project depends on would need an entry here, and there are none.
}

loom {
	mods {
		"realworld" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// Versions live in gradle.properties.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Needed for CommandRegistrationCallback, which /realworld locate registers
	// through. The datapack half of the mod does not use it.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom attaches sourcesJar to a RemapSourcesJar task and to "build" when
	// this is present. Without it no sources jar is produced.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE.txt") {
		rename { "LICENSE_realworld" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Publishing targets, not dependency sources. None configured.
	}
}
