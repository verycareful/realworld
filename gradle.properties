# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
# Four-part version: <minecraft line>.<major>.<minor>.<patch>. The first
# component names the Minecraft line this branch targets. The build target is
# 26.1, while the jar declares the supported 1.21 through 26.1 range.
# Fabric Loader's semver parser accepts any number of components, so ranges
# and comparisons on this work exactly as for three-part versions.
mod_version=1.1.2.0
maven_group=com.fury.realworld

